[project]
name = "postgen"
version = "0.1.0"
description = "Self-hosted LinkedIn post generator: research -> write -> evaluate, learning your voice over time"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "typer",
    "pyyaml",
    "tavily-python",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "types-PyYAML",
    "httpx",
]

[project.scripts]
postgen = "postgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgen"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["postgen"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
