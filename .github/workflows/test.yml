name: Test

on:
  pull_request:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest --tb=short

  docker-build-test:
    name: Test Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64 only for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: postgen:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image can start
        # Runtime is Chainguard python: no shell. Invoke the venv interpreter directly.
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python postgen:test -c "import postgen.web.app; print('import ok')"
          docker run --rm --entrypoint /app/.venv/bin/python postgen:test -m postgen --help
