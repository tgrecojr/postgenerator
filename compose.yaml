services:
  postgen:
    build: .
    image: postgen:local
    env_file: .env                 # ANTHROPIC_API_KEY and any POSTGEN_* overrides
    ports:
      - "127.0.0.1:8790:8790"      # localhost only; front with Tailscale / Cloudflare Zero Trust
    volumes:
      - postgen-data:/data         # profile, corpus, drafts DB, voice profile
    restart: unless-stopped
    stop_grace_period: 60s         # let an in-flight generation record its outcome

volumes:
  postgen-data:
