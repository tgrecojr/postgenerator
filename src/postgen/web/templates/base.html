<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}postgen{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/">postgen</a>
  <nav>
    <a href="/drafts?status=pending">Pending</a>
    <a href="/drafts?status=all">All drafts</a>
    <a href="/corpus">Corpus</a>
    <a href="/voice">Voice</a>
  </nav>
  <form class="generate" method="post" action="/generate">
    <input type="text" name="topic" placeholder="optional topic request" {% if running %}disabled{% endif %}>
    <button type="submit" {% if running %}disabled title="A job is already running"{% endif %}>Generate</button>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
