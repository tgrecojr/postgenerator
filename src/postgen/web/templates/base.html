<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}postgen{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/">postgen</a>
  <nav>
    <a href="/drafts?status=pending">Pending</a>
    <a href="/drafts?status=all">Drafts</a>
    <a href="/corpus">Corpus</a>
    <a href="/voice">Voice</a>
    <a href="/topics">Topics</a>
    <a href="/profile">Profile</a>
    <a href="/jobs">Jobs</a>
    <a href="/settings">Settings</a>
  </nav>
  {% if not ready %}
  <a class="setup-link" href="/setup">Finish setup to generate →</a>
  {% elif running %}
  <a class="setup-link" href="/jobs/{{ active_job }}">A job is running →</a>
  {% else %}
  <form class="generate" method="post" action="/generate">
    <input type="text" name="topic" placeholder="optional topic request">
    <button type="submit">Generate</button>
  </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
